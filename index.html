<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Dashboard</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #e0e0e0;
      --accent: #bb86fc;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      align-items: start; /* Prevents cards from stretching to weird heights */
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--card);
      border-radius: 12px;
      background-color: #1b183a57;
      border: 1px solid #e0ddd5;
      overflow: hidden;
      height: 100%;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h3 {
      margin: 0 0 5px 0;
      color: var(--accent);
    }
    .card .meta {
      font-size: 0.8em;
      color: #aaa;
      margin-bottom: 10px;
    }
    .card .summary {
      margin-bottom: 10px;
      font-size: 0.9em;
    }
    .card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }
    .card-content {
      padding: 15px;
      flex-grow: 1; /* Pushes the media/links to the bottom of the card */
    }
    .card-media {
      padding: 0 15px 15px 15px; /* Keeps the video/link tucked into the bottom */
      margin-top: auto; /* Keeps the video/link at the bottom */
      display: flex;
      align-items: center;
    }
    .card-media iframe, 
    .card-media video,
    .card-media .video-container {
        width: 100%;
        aspect-ratio: 16 / 9; /* The magic line */
        border-radius: 4px;
        background-color: #000; /* Prevents white flashes while loading */
    }
    .meta {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px; /* Spaces out the tag, dot, and time */
    }
    .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    .btn-read, .btn-archive {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s;
    }

    /* Primary "Read" Button */
    .btn-read {
        background-color: #1e3852;
        color: rgb(176, 180, 234);
        flex-grow: 2; /* Makes the main link more prominent */
        text-align: center;
    }

    .btn-read:hover {
        background-color: #224c7a;
    }

    /* Secondary "Archive" Button */
    .btn-archive {
        background-color: #262363;
        color: #7685da;
        border: 1px solid #a1b0e6;
        flex-grow: 1;
        text-align: center;
    }

    .btn-archive:hover {
        background-color: #5a4fae;
        color: #9891e9;
    }
    .source-tag {
      background-color: #514f7b;
      color: #e8e8f5;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
    }
    .separator {
      color: #ccc;
    }
    /* Remove padding for cards that contain only video */
    .video-card {
        background-color: #1a1a1a; /* Dark grey instead of pure black */
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%23333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>');
        background-repeat: no-repeat;
        background-position: center;
        padding: 0 !important;
        margin: 0;
        box-shadow: none; /* Optional: matches the "clean" look */
    }

    /* Optional: Semi-transparent overlay for title and source on video cards */
    .video-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 10px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        color: white;
        pointer-events: none; /* Allows clicks to pass through to the video */
    }

    .video-title {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* The Media Container fills the card space */
    .video-card .card-media {
        flex-grow: 1;
        margin: 0;
        line-height: 0; /* Prevents tiny gaps at the bottom of the iframe */
    }

    .video-card iframe {
        border-radius: 12px; /* Matches modern dashboard aesthetics */
        border: none;
        width: 100%;
        height: 100%;
        aspect-ratio: 16 / 9;
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin-top: 15px; /* Adds space between text and video */
      background: #000; /* Keeps the 'box' black while loading */
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: 100%; /* Prevents it from getting 'giant' */
      border: none;
      background: transparent; /* Prevents the 'double background' issue */
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1></h1>
  <div id="loading" class="loading">Loading news...</div>
  <div class="grid" id="newsGrid"></div>

  <script>
    // 1. Keep these! They handle your video logic
function isYouTube(url) {
  if (!url) return false;
  return url.includes('youtube.com') || url.includes('youtu.be');
}

function embedYouTube(url) {
  // Extract the Video ID from various YouTube URL formats
  let videoId = '';
  try {
    if (url.includes('v=')) {
      videoId = url.split('v=')[1].split('&')[0];
    } else if (url.includes('youtu.be/')) {
      videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('embed/')) {
      videoId = url.split('embed/')[1].split('?')[0];
    }
    
    return `
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/${videoId}" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>`;
    } catch (e) {
      return `<a href="${url}" target="_blank">Watch on YouTube</a>`;
      }
  }

// 2. Fetch data from your new API
async function fetchSheetData() {
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDR2QJaRIySlegq2pF2TX5zYVHXX1klwUePKx5UOTYBc0orFvDZLWu2nu_8ME4BQZH/exec";

  try {
    const response = await fetch(WEB_APP_URL);
    const data = await response.json(); 
    console.log("Success! Data loaded:", data);
    return data;
  } catch (error) {
    console.error("The fetch failed:", error);
    return [];
  }
}

function getCleanSource(sourceUrl) {
  try {
    let str = String(sourceUrl).trim();
    if (!str.startsWith('http')) str = 'https://' + str;

    const url = new URL(str);
    const noise = ['www', 'rss', 'feeds', 'feed', 'service', 'xml', 'api', 'index'];
    
    // Split hostname and strip the "noise"
    let parts = url.hostname.toLowerCase().split('.').filter(p => !noise.includes(p));

    // Define TLDs and "Second Level" connectors that aren't the brand name
    const tlds = ['com', 'org', 'net', 'edu', 'gov', 'io', 'me', 'uk', 'ca', 'ie'];
    const connectors = ['co', 'com', 'org', 'ac', 'net'];

    let name = "";

    if (parts.length > 2) {
      // If the second-to-last part is a connector (like 'co' in bbc.co.uk)
      // we need to go back 3 spots.
      const secondToLast = parts[parts.length - 2];
      if (connectors.includes(secondToLast)) {
        name = parts[parts.length - 3];
      } else {
        name = parts[parts.length - 2];
      }
    } else if (parts.length === 2) {
      // Standard domain (nytimes.com)
      name = parts[0];
    } else {
      name = parts[0] || "Source";
    }

    const brandMap = {
      'arstechnica': 'Ars Technica',
      'theatlantic': 'The Atlantic',
      'longreads': 'Longreads',
      'nytimes': 'NY Times',
      'bbc': 'BBC',
      'bbci': 'BBC'
    };

    return brandMap[name.toLowerCase()] || name.toUpperCase();

  } catch (e) {
    return "SOURCE";
  }
}

function formatTimestamp(isoString) {
  try {
    if (!isoString) return "Recently";
    
    const itemDate = new Date(isoString);
    const today = new Date();
    
    // Reset times to midnight for an accurate day-by-day comparison
    const itemDay = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());
    const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    
    const diffTime = todayDay - itemDay;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    const timeString = String(itemDate.getHours()).padStart(2, '0') + ":" + 
                       String(itemDate.getMinutes()).padStart(2, '0');

    if (diffDays === 0) {
      return `Today at ${timeString}`;
    } else if (diffDays === 1) {
      return `Yesterday at ${timeString}`;
    } else if (diffDays < 7) {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      return `${days[itemDate.getDay()]} at ${timeString}`;
    } else {
      // Fallback for anything older than a week
      return `${itemDate.getMonth() + 1}-${itemDate.getDate()} at ${timeString}`;
    }
  } catch (e) {
    return "Recently";
  }
}

// 3. Render the news to the grid
async function renderNews() {
  const data = await fetchSheetData();
  const grid = document.getElementById("newsGrid");
  const loading = document.getElementById("loading");

  if (data.length === 0) {
    loading.textContent = "No news items found.";
    return;
  }

  loading.style.display = "none";
  
  grid.innerHTML = data.map(item => {
    const isVideo = isYouTube(item.Link);

    // If it's a video, return a simplified "Video Card" structure
  if (isVideo) {
    return `
      <div class="card video-card">
        <div class="card-media">
          ${embedYouTube(item.Link)}
        </div>
      </div>
    `;
  }

  // Define archiveUrl only for articles to save processing
  const archiveUrl = `https://archive.is/?run=1&url=${encodeURIComponent(item.Link)}`;

  return `
    <div class="card article-card">
      <div class="card-content">
        <h3>${item.Title || "Untitled"}</h3>
        <div class="meta">
          <span class="source-tag">${getCleanSource(item.Source)}</span> 
          <span class="separator">•</span> 
          ${formatTimestamp(item.Timestamp)}
        </div>
        <div class="summary">${item.Summary || "No summary"}</div>
      </div>
      <div class="card-media">
        <div class="action-buttons">
          <a href="${item.Link}" class="btn-read" target="_blank">Read Article</a>
          <a href="${archiveUrl}" class="btn-archive" target="_blank">Archive</a>
        </div>
      </div>
    </div>
    `;
  }).join("");
}

renderNews();
  </script>
</body>
</html>
