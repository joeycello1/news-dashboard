<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Dashboard</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #e0e0e0;
      --accent: #bb86fc;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      align-items: start; /* Prevents cards from stretching to weird heights */
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--card);
      border-radius: 12px;
      background-color: #1b183a57;
      border: 1px solid #e0ddd5;
      overflow: hidden;
      height: 100%;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h3 {
      margin: 0 0 5px 0;
      color: var(--accent);
    }
    .card .meta {
      font-size: 0.8em;
      color: #aaa;
      margin-bottom: 10px;
    }
    .card .summary {
      margin-bottom: 10px;
      font-size: 0.9em;
    }
    .card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }
    .card-content {
      padding: 15px;
    }
    .card-media {
      padding: 0 15px 15px 15px; /* Keeps the video/link tucked into the bottom */
      margin-top: auto;
    }
    .meta {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px; /* Spaces out the tag, dot, and time */
    }
    .source-tag {
      background-color: #514f7b;
      color: #e8e8f5;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
    }
    .separator {
      color: #ccc;
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin-top: 15px; /* Adds space between text and video */
      background: #000; /* Keeps the 'box' black while loading */
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: 100%; /* Prevents it from getting 'giant' */
      border: none;
      background: transparent; /* Prevents the 'double background' issue */
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1></h1>
  <div id="loading" class="loading">Loading news...</div>
  <div class="grid" id="newsGrid"></div>

  <script>
    // 1. Keep these! They handle your video logic
function isYouTube(url) {
  return url && (url.includes("youtube.com") || url.includes("youtu.be"));
}

function embedYouTube(url) {
  const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
  const match = url.match(regex);
  const videoId = match ? match[1] : null;

  if (!videoId) return "";

  // Added a max-width and internal style to "force" size compliance
  return `
    <div class="video-container" style="max-width: 100%; position: relative;">
      <iframe 
        src="https://www.youtube.com/embed/${videoId}" 
        frameborder="0" 
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
        allowfullscreen>
      </iframe>
    </div>`;
}

// 2. Fetch data from your new API
async function fetchSheetData() {
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDR2QJaRIySlegq2pF2TX5zYVHXX1klwUePKx5UOTYBc0orFvDZLWu2nu_8ME4BQZH/exec";

  try {
    const response = await fetch(WEB_APP_URL);
    const data = await response.json(); 
    console.log("Success! Data loaded:", data);
    return data;
  } catch (error) {
    console.error("The fetch failed:", error);
    return [];
  }
}

function getCleanSource(sourceUrl) {
  try {
    let str = String(sourceUrl).trim();
    if (!str.startsWith('http')) str = 'https://' + str;

    const url = new URL(str);
    const noise = ['www', 'rss', 'feeds', 'feed', 'service', 'xml', 'api', 'index'];
    
    // Split hostname and strip the "noise"
    let parts = url.hostname.toLowerCase().split('.').filter(p => !noise.includes(p));

    // Define TLDs and "Second Level" connectors that aren't the brand name
    const tlds = ['com', 'org', 'net', 'edu', 'gov', 'io', 'me', 'uk', 'ca', 'ie'];
    const connectors = ['co', 'com', 'org', 'ac', 'net'];

    let name = "";

    if (parts.length > 2) {
      // If the second-to-last part is a connector (like 'co' in bbc.co.uk)
      // we need to go back 3 spots.
      const secondToLast = parts[parts.length - 2];
      if (connectors.includes(secondToLast)) {
        name = parts[parts.length - 3];
      } else {
        name = parts[parts.length - 2];
      }
    } else if (parts.length === 2) {
      // Standard domain (nytimes.com)
      name = parts[0];
    } else {
      name = parts[0] || "Source";
    }

    const brandMap = {
      'arstechnica': 'Ars Technica',
      'theatlantic': 'The Atlantic',
      'longreads': 'Longreads',
      'nytimes': 'NY Times',
      'bbc': 'BBC',
      'bbci': 'BBC'
    };

    return brandMap[name.toLowerCase()] || name.toUpperCase();

  } catch (e) {
    return "SOURCE";
  }
}

function formatTimestamp(isoString) {
  try {
    if (!isoString) return "Recently";
    
    const itemDate = new Date(isoString);
    const today = new Date();
    
    // Reset times to midnight for an accurate day-by-day comparison
    const itemDay = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());
    const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    
    const diffTime = todayDay - itemDay;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    const timeString = String(itemDate.getHours()).padStart(2, '0') + ":" + 
                       String(itemDate.getMinutes()).padStart(2, '0');

    if (diffDays === 0) {
      return `Today at ${timeString}`;
    } else if (diffDays === 1) {
      return `Yesterday at ${timeString}`;
    } else if (diffDays < 7) {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      return `${days[itemDate.getDay()]} at ${timeString}`;
    } else {
      // Fallback for anything older than a week
      return `${itemDate.getMonth() + 1}-${itemDate.getDate()} at ${timeString}`;
    }
  } catch (e) {
    return "Recently";
  }
}

// 3. Render the news to the grid
async function renderNews() {
  const data = await fetchSheetData();
  const grid = document.getElementById("newsGrid");
  const loading = document.getElementById("loading");

  if (data.length === 0) {
    loading.textContent = "No news items found.";
    return;
  }

  loading.style.display = "none";
  grid.innerHTML = data.map(item => `
  <div class="card">
    <div class="card-content">
      <h3>${item.Title || "Untitled"}</h3>
      <div class="meta">
        <span class="source-tag">${getCleanSource(item.Source)}</span> 
        <span class="separator">•</span> 
        ${formatTimestamp(item.Timestamp)}
      </div>
      <div class="summary">${item.Summary || "No summary"}</div>
    </div>
    <div class="card-media">
      ${isYouTube(item.Link) ? embedYouTube(item.Link) : (item.Link ? `<a href="${item.Link}" target="_blank">Read more →</a>` : "")}
    </div>
  </div>
`).join("");
}

renderNews();
  </script>
</body>
</html>
