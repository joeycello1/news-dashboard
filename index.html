<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Dashboard</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1b183a57; /* Your preferred purple-tinted dark */
      --text: #e0e0e0;
      --accent: #bb86fc;
      --meta: #aaa;
      --border: #e0ddd533; /* Slightly transparent so it's not too harsh */
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Grid Setup */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      align-items: stretch; /* Cards will be same height in a row */
    }

    /* Universal Card Style */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    /* Title Link Styles */
    .title-link {
      text-decoration: none;
      color: var(--accent);
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .title-link:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    /* Content Layout */
    .card-content {
      padding: 15px;
      flex-grow: 1; /* Pushes media section to the bottom */
    }

    .card h3 {
      margin: 0 0 8px 0;
      line-height: 1.3;
    }

    .meta {
      font-size: 0.8rem;
      color: var(--meta);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .source-tag {
      background-color: #514f7b;
      color: #e8e8f5;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .summary {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #ccc;
    }

    /* Media & Button Section */
    .card-media {
      padding: 0 15px 15px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Unified Video Handling */
    .video-card {
      padding: 0 !important;
      background-color: #000;
    }

    .video-card .card-media {
      padding: 0;
      margin: 0;
    }

    iframe, video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block; /* Removes bottom whitespace */
    }

    /* Archive Button (Specific for Articles) */
    .action-buttons {
      display: flex;
      width: 100%;
    }

    .btn-archive {
      background-color: #262363;
      color: #7685da;
      border: 1px solid #a1b0e6;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-archive:hover {
      background-color: #5a4fae;
      color: #fff;
    }

    /* Audio Player Styling */
    audio {
      width: 100%;
      height: 35px;
    }

    /* Hide Button (Fixed positioning for all cards) */
    .btn-hide {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-hide:hover {
      background: #ff4d4d;
    }

    /* iPad/Mobile Tap Targets */
    @media (pointer: coarse) {
      .btn-hide {
        width: 36px;
        height: 36px;
        font-size: 20px;
      }
    }

    .loading { text-align: center; padding: 40px; color: var(--meta); }
</style>
</head>
<body>
  <h1></h1>
  <div id="loading" class="loading">Loading news...</div>
  <div class="grid" id="newsGrid"></div>

  <script>
    // 1. Keep these! They handle your video logic
function isYouTube(url) {
  if (!url) return false;
  return url.includes('youtube.com') || url.includes('youtu.be');
}

function embedYouTube(url) {
  // Extract the Video ID from various YouTube URL formats
  let videoId = '';
  try {
    if (url.includes('v=')) {
      videoId = url.split('v=')[1].split('&')[0];
    } else if (url.includes('youtu.be/')) {
      videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('embed/')) {
      videoId = url.split('embed/')[1].split('?')[0];
    }
    
    return `
      <div class="video-card">
        <iframe 
          src="https://www.youtube.com/embed/${videoId}" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>`;
    } catch (e) {
      return `<a href="${url}" target="_blank">Watch on YouTube</a>`;
      }
  }

// 2. Fetch data from your new API
async function fetchSheetData() {
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4kKFWfP1-dP5bFRBYyOBKmmOOSimpD65dYPFKIZt4b13pWkYnQVG9326obLnn_G0D/exec";

  try {
    const response = await fetch(WEB_APP_URL);
    const data = await response.json(); 
    console.log("Success! Data loaded:", data);
    return data;
  } catch (error) {
    console.error("The fetch failed:", error);
    return [];
  }
}

function getCleanSource(sourceUrl) {
  try {
    let str = String(sourceUrl).trim();
    if (!str.startsWith('http')) str = 'https://' + str;

    const url = new URL(str);
    const noise = ['www', 'rss', 'feeds', 'feed', 'service', 'xml', 'api', 'index'];
    
    // Split hostname and strip the "noise"
    let parts = url.hostname.toLowerCase().split('.').filter(p => !noise.includes(p));

    // Define TLDs and "Second Level" connectors that aren't the brand name
    const tlds = ['com', 'org', 'net', 'edu', 'gov', 'io', 'me', 'uk', 'ca', 'ie'];
    const connectors = ['co', 'com', 'org', 'ac', 'net'];

    let name = "";

    if (parts.length > 2) {
      // If the second-to-last part is a connector (like 'co' in bbc.co.uk)
      // we need to go back 3 spots.
      const secondToLast = parts[parts.length - 2];
      if (connectors.includes(secondToLast)) {
        name = parts[parts.length - 3];
      } else {
        name = parts[parts.length - 2];
      }
    } else if (parts.length === 2) {
      // Standard domain (nytimes.com)
      name = parts[0];
    } else {
      name = parts[0] || "Source";
    }

    const brandMap = {
      'arstechnica': 'Ars Technica',
      'theatlantic': 'The Atlantic',
      'longreads': 'Longreads',
      'nytimes': 'NY Times',
      'bbc': 'BBC',
      'bbci': 'BBC',
      'simplecast': 'The Daily'
    };

    return brandMap[name.toLowerCase()] || name.toUpperCase();

  } catch (e) {
    return "SOURCE";
  }
}

function formatTimestamp(isoString) {
  try {
    if (!isoString) return "Recently";
    
    const itemDate = new Date(isoString);
    const today = new Date();
    
    // Reset times to midnight for an accurate day-by-day comparison
    const itemDay = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());
    const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    
    const diffTime = todayDay - itemDay;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    const timeString = String(itemDate.getHours()).padStart(2, '0') + ":" + 
                       String(itemDate.getMinutes()).padStart(2, '0');

    if (diffDays === 0) {
      return `Today at ${timeString}`;
    } else if (diffDays === 1) {
      return `Yesterday at ${timeString}`;
    } else if (diffDays < 7) {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      return `${days[itemDate.getDay()]} at ${timeString}`;
    } else {
      // Fallback for anything older than a week
      return `${itemDate.getMonth() + 1}-${itemDate.getDate()} at ${timeString}`;
    }
  } catch (e) {
    return "Recently";
  }
}

// Function to hide a card
function hideArticle(link) {
  const hiddenArticles = JSON.parse(localStorage.getItem('hiddenArticles') || '[]');
  hiddenArticles.push(link);
  localStorage.setItem('hiddenArticles', JSON.stringify(hiddenArticles));
  
  // Immediately remove it from the DOM for that smooth "poof" effect
  const card = document.querySelector(`[data-link="${link}"]`);
  if (card) {
    card.style.opacity = '0';
    setTimeout(() => card.remove(), 300); // Wait for fade-out
  }
}

// 3. Render the news to the grid
async function renderNews() {
  const rawData = await fetchSheetData();
  const hiddenArticles = JSON.parse(localStorage.getItem('hiddenArticles') || '[]');
  
  // Filter out anything in our "trash" list
  const data = rawData.filter(item => !hiddenArticles.includes(item.Link));

  const grid = document.getElementById("newsGrid");
  const loading = document.getElementById("loading");

  if (data.length === 0) {
    loading.textContent = "No news items found.";
    return;
  }

  loading.style.display = "none";
  
  grid.innerHTML = data.map(item => {
  const isVideo = isYouTube(item.Link);
  const audioUrl = item.AudioLink;
  const hasAudio = audioUrl && audioUrl.toString().trim() !== "";
  const archiveUrl = `https://archive.is/?run=1&url=${encodeURIComponent(item.Link || '')}`;

  // Helper for the clickable Title
  const cardTitle = `<h3><a href="${item.Link}" target="_blank" class="title-link">${item.Title || "Untitled"}</a></h3>`;

  // 1. VIDEO LAYOUT (Keeping it minimal as per your preference)
  if (isVideo) {
    return `
      <div class="card video-card" data-link="${item.Link}">
        <button class="btn-hide" onclick="hideArticle('${item.Link}')">×</button>
        <div class="card-media">${embedYouTube(item.Link)}</div>
      </div>`;
  }

  // 2. ARTICLE & PODCAST LAYOUT
  return `
    <div class="card ${hasAudio ? 'podcast-card' : 'article-card'}" data-link="${item.Link}">
      <button class="btn-hide" onclick="hideArticle('${item.Link}')">×</button>
      <div class="card-content">
        ${cardTitle}
        <div class="meta">
          <span class="source-tag">${getCleanSource(item.Source)}</span> 
          • ${formatTimestamp(item.Timestamp)}
        </div>
        <div class="summary">${item.Summary || ""}</div>
      </div>
      <div class="card-media">
        ${hasAudio ? `
          <div class="audio-container">
            <audio controls preload="none" style="width:100%;">
              <source src="${audioUrl}" type="audio/mpeg">
            </audio>
          </div>
        ` : `
          <div class="action-buttons">
            <a href="${archiveUrl}" class="btn-archive" target="_blank">Read on Archive</a>
          </div>
        `}
      </div>
    </div>`;
}).join("");
}

renderNews();
  </script>
</body>
</html>
